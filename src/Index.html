<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- Local preview only. Apps Script ignores this tag; doGet calls addMetaTag. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9c3418">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tsuke">
  <title>Tsuke</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23f4f0e6' width='64' height='64'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%239c3418' stroke-width='3'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-size='22' fill='%239c3418' font-family='serif'%3E記%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f3ecdf;
      --card: #fbf7ef;
      --ink: #241c16;
      --muted: #6f6256;
      --line: #e4d8c6;
      --seal: #9c3418;
      --seal-ink: #fff8ef;
      --ok: #1f6a45;
      --shadow: 0 18px 40px rgba(60, 36, 18, 0.08);
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 0 1.15rem, rgba(156, 52, 24, 0.35) 1.15rem 1.22rem, transparent 1.22rem),
        repeating-linear-gradient(180deg, transparent 0 1.85rem, rgba(90, 62, 36, 0.05) 1.85rem 1.9rem),
        var(--paper);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti TC", "PMingLiU", "Noto Serif TC", serif;
      font-size: 1.0625rem;
      line-height: 1.45;
    }
    main {
      width: min(36rem, 100%);
      margin: 0 auto;
      padding:
        calc(1.1rem + env(safe-area-inset-top, 0px))
        calc(1.1rem + env(safe-area-inset-right, 0px))
        calc(1.75rem + env(safe-area-inset-bottom, 0px))
        calc(1.1rem + env(safe-area-inset-left, 0px));
    }
    header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1.25rem; }
    .seal {
      width: 3.4rem;
      height: 3.4rem;
      border: 2px solid var(--seal);
      border-radius: 50%;
      color: var(--seal);
      display: grid;
      place-items: center;
      font-size: 1.45rem;
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 1px rgba(156, 52, 24, 0.35);
      flex: none;
    }
    h1 { font-size: 2rem; font-weight: 560; letter-spacing: 0.04em; margin: 0; line-height: 1; }
    h1 span { display: block; margin-top: 0.35rem; color: var(--muted); font-size: 1rem; letter-spacing: 0.08em; }
    .sheet {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.1rem;
      box-shadow: var(--shadow);
      padding: 1.15rem 1.05rem 1.2rem;
    }
    label { display: block; font-size: 1rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="text"] {
      width: 100%;
      border: 0;
      border-bottom: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 1.375rem;
      line-height: 1.35;
      min-height: 3.25rem;
      padding: 0.85rem 0.1rem 0.55rem;
      border-radius: 0;
    }
    input[type="text"]:focus, select:focus { outline: 3px solid rgba(156, 52, 24, 0.25); outline-offset: 3px; }
    select {
      width: 100%;
      margin-top: 0.35rem;
      border: 1px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 1.375rem;
      line-height: 1.35;
      min-height: 3.25rem;
      padding: 0.35rem 0.4rem;
      border-radius: 0.4rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0 0.35rem; }
    .chips button, .submit {
      font: 600 1.0625rem/1.2 "Avenir Next", "PingFang TC", "Noto Sans TC", sans-serif;
      min-height: 3.25rem;
      border-radius: 999px;
      touch-action: manipulation;
    }
    .chips button {
      border: 1px solid #c9b8a2;
      background: transparent;
      color: var(--ink);
      padding: 0.7rem 1.15rem;
      min-width: 4.75rem;
    }
    .chips button.is-on { background: var(--ink); color: var(--seal-ink); border-color: var(--ink); }
    .chips button:focus-visible, .submit:focus-visible { outline: 3px solid rgba(156, 52, 24, 0.35); outline-offset: 2px; }
    .submit {
      width: 100%;
      margin-top: 1rem;
      min-height: 3.5rem;
      font-size: 1.1875rem;
      border: 0;
      background: var(--seal);
      color: var(--seal-ink);
      letter-spacing: 0.12em;
    }
    .submit:disabled { opacity: 0.55; }
    .quiet, .danger {
      width: 100%;
      margin-top: 0.6rem;
      min-height: 3.25rem;
      border-radius: 999px;
      font: 600 1.0625rem/1.2 "Avenir Next", "PingFang TC", "Noto Sans TC", sans-serif;
      touch-action: manipulation;
    }
    .quiet { border: 1px solid #c9b8a2; background: transparent; color: var(--ink); }
    .danger { border: 1px solid var(--seal); background: transparent; color: var(--seal); }
    .danger.is-armed { background: var(--seal); color: var(--seal-ink); }
    #status, #edit-status { min-height: 1.5rem; margin: 0.85rem 0 0; font-size: 1.0625rem; }
    #status.is-bad, #edit-status.is-bad { color: var(--seal); }
    #status.is-ok, #edit-status.is-ok { color: var(--ok); }
    #edit-form label { margin-top: 0.85rem; }
    #preview { margin: 0.85rem 0 0; color: var(--muted); font-size: 1rem; min-height: 1.4rem; }
    .hint { color: var(--muted); font-size: 1rem; margin: 0.9rem 0 0; line-height: 1.45; }
    h2 { font-size: 1.125rem; font-weight: 560; margin: 1.5rem 0 0.45rem; letter-spacing: 0.08em; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { list-style: none; }
    .entry-tap {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.35rem 0.8rem;
      padding: 0.75rem 0;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      min-height: 3.25rem;
      touch-action: manipulation;
    }
    .entry-tap strong, li strong { font-weight: 560; font-size: 1.125rem; }
    .meta, .amount { font-family: "Avenir Next", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 1rem; }
    .meta { color: var(--muted); grid-column: 1; }
    .amount { font-variant-numeric: tabular-nums; text-align: right; }
    .empty { color: var(--muted); border-top: 1px solid var(--line); padding-top: 0.8rem; }
    #demo-banner {
      background: #efe2c4;
      border: 1px dashed #9c3418;
      border-radius: 0.8rem;
      padding: 0.7rem 0.8rem;
      margin-bottom: 0.9rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <p id="demo-banner" hidden>本機預覽，不會寫入 Google 帳本。畫面上的紀錄是範例。</p>
    <header>
      <div class="seal" aria-hidden="true">記</div>
      <h1>Tsuke<span>つけ · 記一筆</span></h1>
    </header>
    <form id="entry-form" class="sheet">
      <label for="line">今天記什麼</label>
        <input id="line" name="line" type="text" maxlength="500" autocomplete="off" autocapitalize="off" enterkeyhint="done" placeholder="例如：早餐 80">
        <div class="chips" id="category-chips" role="group" aria-label="分類"></div>
        <div class="chips" id="chips" role="group" aria-label="付款方式"></div>
      <p id="preview"></p>
      <button class="submit" id="submit" type="submit">記下</button>
      <p id="status" role="status" aria-live="polite"></p>
        <p class="hint">分類會先照猜測選好，點一下就固定。最近的帳可以點開修改，刪除要再按一次。以「日誌」開頭會寫進日曆「Tsuke 日誌」，不會進帳目。</p>
      </form>
      <h2>最近</h2>
      <form id="edit-form" class="sheet" hidden>
        <p class="hint" id="edit-heading">修改這一筆</p>
        <label for="edit-name">名稱</label>
        <input id="edit-name" type="text" maxlength="80" autocomplete="off" autocapitalize="off">
        <label for="edit-amount">金額</label>
        <input id="edit-amount" type="text" inputmode="decimal" maxlength="16" autocomplete="off">
        <label for="edit-currency">幣別</label>
        <select id="edit-currency"></select>
        <div class="chips" id="edit-category-chips" role="group" aria-label="分類"></div>
        <div class="chips" id="edit-payment-chips" role="group" aria-label="付款方式"></div>
        <button class="submit" id="edit-save" type="submit">儲存</button>
        <button class="danger" id="edit-delete" type="button">刪除</button>
        <button class="quiet" id="edit-cancel" type="button">取消</button>
        <p id="edit-status" role="status" aria-live="polite"></p>
      </form>
      <ul id="recent"></ul>
  </main>
  <script>
    (function () {
      var DEMO = {
        ok: true,
        defaultPaymentCode: 'cube',
        payments: [
          { code: 'cube', name: '範例信用卡 Cube' },
          { code: 'ef', name: '範例信用卡 EF' },
          { code: '現金', name: '現金' },
          { code: '轉帳', name: '轉帳' }
        ],
        categories: [
          { name: '吃' }, { name: '公益' }, { name: '書' }, { name: '日常' },
          { name: '贈禮' }, { name: 'AI工具' }, { name: '娛樂' }
        ],
        currencies: ['TWD', 'USD', 'JPY', 'EUR', 'HKD', 'CNY', 'KRW', 'GBP', 'SGD', 'AUD', 'CHF', 'CAD', 'THB', 'MYR', 'PHP', 'VND'],
        recent: [
          { rowNumber: 2, date: '2026-01-01', name: '早餐（範例）', amount: 80, currency: 'TWD', category: '吃', paymentCode: '現金', paymentName: '現金', tag: '', twd: 80 }
        ]
      };
      var DEMO_MEMORY = { '早餐': '現金' };
      var state = { payments: [], categories: [], currencies: [], defaultPaymentCode: '', recent: [] };
      var selectedCode = '';
      var pinned = false;
      var selectedCategory = '';
      var categoryPinned = false;
      var lastKey = '';
      var explicitCode = '';
      var saving = false;
      var demo = false;
      var previewTimer = 0;
      var previewSeq = 0;
      var editRow = 0;
      var editCategory = '';
      var editPayment = '';
      var deleteArmed = false;
      var form = document.getElementById('entry-form');
      var lineInput = document.getElementById('line');
      var chips = document.getElementById('chips');
      var categoryChips = document.getElementById('category-chips');
      var preview = document.getElementById('preview');
      var status = document.getElementById('status');
      var recent = document.getElementById('recent');
      var submitButton = document.getElementById('submit');
      var editForm = document.getElementById('edit-form');
      var editName = document.getElementById('edit-name');
      var editAmount = document.getElementById('edit-amount');
      var editCurrency = document.getElementById('edit-currency');
      var editCategoryChips = document.getElementById('edit-category-chips');
      var editPaymentChips = document.getElementById('edit-payment-chips');
      var editDelete = document.getElementById('edit-delete');
      var editStatus = document.getElementById('edit-status');

      form.addEventListener('submit', onSubmit);
      lineInput.addEventListener('input', schedulePreview);
      editForm.addEventListener('submit', onEditSubmit);
      editDelete.addEventListener('click', onDeleteTap);
      document.getElementById('edit-cancel').addEventListener('click', closeEdit);
      editName.addEventListener('input', disarmDelete);
      editAmount.addEventListener('input', disarmDelete);
      editCurrency.addEventListener('change', disarmDelete);

      function boot() {
        if (window.google && google.script && google.script.run) {
          setStatus('讀取中…', false);
          google.script.run.withSuccessHandler(applyState).withFailureHandler(function () {
            setStatus('連線失敗，請再試一次。', true);
          }).getWebAppState();
          return;
        }
        demo = true;
        document.getElementById('demo-banner').hidden = false;
        applyState(DEMO);
      }

      function applyState(next) {
        if (!next || !next.ok) {
          setStatus((next && next.message) || '帳本讀取失敗。請先執行 setupTsuke。', true);
          return;
        }
        state.payments = (next.payments || []).filter(function (payment) {
          return payment && isChipCode(payment.code);
        }).slice(0, 24);
        state.categories = (next.categories || []).filter(function (category) {
          return category && isChipCategory(category.name);
        }).slice(0, 24);
        state.currencies = (next.currencies || []).filter(isCurrencyCode);
        state.defaultPaymentCode = isChipCode(next.defaultPaymentCode) ? next.defaultPaymentCode : (state.payments[0] ? state.payments[0].code : '');
        state.recent = Array.isArray(next.recent) ? next.recent : [];
        if (!pinned) selectChip(state.defaultPaymentCode);
        renderChips();
        renderCategoryChips(categoryChips, selectedCategory, onCategoryChip);
        renderCurrencies();
        renderRecent();
        attachManifest(next.manifestUrl);
        setStatus('', false);
      }

      function renderChips() {
        chips.textContent = '';
        state.payments.forEach(function (payment) {
          var button = document.createElement('button');
          button.type = 'button';
          button.dataset.code = payment.code;
          button.textContent = payment.name || payment.code;
          button.setAttribute('aria-pressed', button.dataset.code === selectedCode ? 'true' : 'false');
          if (button.dataset.code === selectedCode) button.classList.add('is-on');
          button.addEventListener('click', function () { onChip(payment.code); });
          chips.appendChild(button);
        });
      }

      function renderCategoryChips(container, selected, onPick) {
        container.textContent = '';
        state.categories.forEach(function (category) {
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = category.name;
          button.setAttribute('aria-pressed', button.textContent === selected ? 'true' : 'false');
          if (button.textContent === selected) button.classList.add('is-on');
          button.addEventListener('click', function () { onPick(category.name); });
          container.appendChild(button);
        });
      }

      function renderCurrencies() {
        var current = editCurrency.value;
        editCurrency.textContent = '';
        state.currencies.forEach(function (code) {
          var option = document.createElement('option');
          option.value = code;
          option.textContent = code;
          editCurrency.appendChild(option);
        });
        if (state.currencies.indexOf(current) !== -1) editCurrency.value = current;
      }

      function renderRecent() {
        recent.textContent = '';
        if (!state.recent.length) {
          var empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = '還沒有紀錄';
          recent.appendChild(empty);
          return;
        }
        state.recent.slice(0, 8).forEach(function (entry) {
          var item = document.createElement('li');
          if (!isRowNumber(entry.rowNumber)) {
            item.textContent = entry.name || '';
            recent.appendChild(item);
            return;
          }
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'entry-tap';
          var name = document.createElement('strong');
          name.textContent = entry.name || '';
          var meta = document.createElement('span');
          meta.className = 'meta';
          meta.textContent = [entry.date, entry.category, entry.paymentName, entry.tag].filter(Boolean).join(' · ');
          var amount = document.createElement('span');
          amount.className = 'amount';
          amount.textContent = formatAmount(entry);
          button.appendChild(name);
          button.appendChild(amount);
          button.appendChild(meta);
          button.addEventListener('click', function () { openEdit(entry); });
          item.appendChild(button);
          recent.appendChild(item);
        });
      }

      function onCategoryChip(name) {
        categoryPinned = true;
        selectedCategory = name;
        renderCategoryChips(categoryChips, selectedCategory, onCategoryChip);
        schedulePreview();
      }

      function onChip(code) {
        if (explicitCode) {
          lineInput.value = removeToken(lineInput.value, explicitCode);
          explicitCode = '';
        }
        pinned = true;
        selectChip(code);
        renderChips();
        schedulePreview();
      }

      function schedulePreview() {
        window.clearTimeout(previewTimer);
        previewTimer = window.setTimeout(runPreview, 220);
      }

      function runPreview() {
        var seq = ++previewSeq;
        var line = lineInput.value;
        if (!line.trim()) {
          pinned = false;
          categoryPinned = false;
          selectedCategory = '';
          lastKey = '';
          explicitCode = '';
          selectChip(state.defaultPaymentCode);
          renderChips();
          renderCategoryChips(categoryChips, selectedCategory, onCategoryChip);
          preview.textContent = '';
          submitButton.textContent = '記下';
          return;
        }
        if (demo) {
          showPreview(seq, previewLocally(line));
          return;
        }
        google.script.run.withSuccessHandler(function (result) {
          showPreview(seq, result);
        }).withFailureHandler(function () {
          if (seq !== previewSeq) return;
          preview.textContent = '';
        }).previewEntry(line);
      }

      function showPreview(seq, result) {
        if (seq !== previewSeq || !result) return;
        if (!result.ok) {
          preview.textContent = result.message || '';
          submitButton.textContent = '記下';
          return;
        }
        if (result.type === 'log') {
          preview.textContent = result.summary || '這則會寫成全日曆事件';
          submitButton.textContent = '寫入日誌';
          return;
        }
        submitButton.textContent = '記下';
        if (lastKey && result.merchantKey !== lastKey) {
          pinned = false;
          categoryPinned = false;
        }
        lastKey = result.merchantKey || '';
        if (result.categorySource === 'explicit') {
          categoryPinned = false;
          selectedCategory = result.category || '';
        } else if (!categoryPinned && result.category) {
          selectedCategory = result.category;
        }
        renderCategoryChips(categoryChips, selectedCategory, onCategoryChip);
        explicitCode = result.explicitPaymentCode || '';
        if (explicitCode) {
          if (!selectChip(explicitCode)) clearChipSelection();
        } else if (!pinned && result.suggestedPaymentCode) {
          selectChip(result.suggestedPaymentCode);
        }
        renderChips();
        preview.textContent = expensePreviewText(result, shownCategory(result));
      }

      function onSubmit(event) {
        event.preventDefault();
        var line = lineInput.value;
        if (!line.trim() || saving) return;
        saving = true;
        submitButton.disabled = true;
        if (demo) {
          var local = previewLocally(line);
          if (!local.ok) {
            setStatus(local.message || '沒有記下', true);
          } else if (local.type === 'log') {
            setStatus('本機預覽，沒有寫入日曆。', false);
            lineInput.value = '';
            submitButton.textContent = '記下';
            categoryPinned = false;
            selectedCategory = '';
            renderCategoryChips(categoryChips, selectedCategory, onCategoryChip);
          } else {
            var category = shownCategory(local);
            var code = explicitCode || selectedCode;
            state.recent.unshift({
              rowNumber: nextDemoRow(),
              date: '2026-01-02',
              name: (local.name || '（未命名）') + '（範例）',
              amount: local.amount,
              currency: local.currency || 'TWD',
              category: category,
              paymentCode: code,
              paymentName: paymentName(code),
              tag: '',
              twd: local.currency === 'USD' ? null : local.amount
            });
            renderRecent();
            lineInput.value = '';
            pinned = false;
            categoryPinned = false;
            selectedCategory = '';
            renderCategoryChips(categoryChips, selectedCategory, onCategoryChip);
            submitButton.textContent = '記下';
            setStatus('本機預覽，沒有寫入帳本。', false);
          }
          saving = false;
          submitButton.disabled = false;
          preview.textContent = '';
          return;
        }
        google.script.run.withSuccessHandler(function (result) {
          saving = false;
          submitButton.disabled = false;
          if (!result || !result.ok) {
            setStatus((result && result.message) || '沒有記下', true);
            return;
          }
          setStatus(result.message || '已記下', false);
          lineInput.value = '';
          pinned = false;
          categoryPinned = false;
          selectedCategory = '';
          lastKey = '';
          explicitCode = '';
          preview.textContent = '';
          submitButton.textContent = '記下';
          renderCategoryChips(categoryChips, selectedCategory, onCategoryChip);
          refreshRecent();
        }).withFailureHandler(function () {
          saving = false;
          submitButton.disabled = false;
          setStatus('連線失敗，請再試一次。', true);
        }).addEntryFromWeb(line, selectedCode || '', pinned === true, selectedCategory || '', categoryPinned === true);
      }

      function refreshRecent() {
        google.script.run.withSuccessHandler(function (next) {
          if (!next || !next.ok) return;
          state.recent = next.recent || [];
          renderRecent();
        }).withFailureHandler(function () {}).getWebAppState();
      }

      function selectChip(code) {
        if (!isChipCode(code)) return false;
        var known = state.payments.some(function (payment) { return payment.code === code; });
        if (!known) return false;
        selectedCode = code;
        return true;
      }

      function clearChipSelection() {
        selectedCode = '';
      }

      function paymentName(code) {
        var found = state.payments.filter(function (payment) { return payment.code === code; })[0];
        return found ? found.name : code;
      }

      function setStatus(message, isError) {
        setLive(status, message, isError);
      }

      function setLive(node, message, isError) {
        node.textContent = message || '';
        node.className = message ? (isError ? 'is-bad' : 'is-ok') : '';
      }

      function formatAmount(entry) {
        var amount = Number(entry.amount);
        if (!isFinite(amount)) return '';
        var text = amount.toLocaleString('zh-Hant', { maximumFractionDigits: 2 }) + ' ' + (entry.currency || '');
        if (entry.currency && entry.currency !== 'TWD' && typeof entry.twd === 'number') {
          text += ' · 約 ' + Number(entry.twd).toLocaleString('zh-Hant', { maximumFractionDigits: 0 });
        }
        return text;
      }

      function isChipCode(code) {
        return /^[\u4e00-\u9fffA-Za-z0-9_-]{1,32}$/.test(String(code || ''));
      }

      function removeToken(line, code) {
        var parts = String(line).split(/\s+/);
        for (var i = parts.length - 1; i >= 0; i--) {
          if (parts[i].toLowerCase() === String(code).toLowerCase() || parts[i] === code) {
            parts.splice(i, 1);
            break;
          }
        }
        return parts.join(' ').trim();
      }

      function attachManifest(url) {
        if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\?page=manifest$/.test(String(url || ''))) return;
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = url;
        document.head.appendChild(link);
      }

      boot();

      function shownCategory(result) {
        if (!result) return '';
        if (result.categorySource === 'explicit') return result.category || '';
        if (categoryPinned && selectedCategory) return selectedCategory;
        return result.category || '';
      }

      function expensePreviewText(result, category) {
        return result.date + (result.time ? ' ' + result.time : '') + ' · ' + result.name + ' ' + result.amount + ' ' + result.currency + ' · ' + category;
      }

      function nextDemoRow() {
        var next = 3;
        state.recent.forEach(function (entry) {
          if (isRowNumber(entry.rowNumber) && entry.rowNumber >= next) next = entry.rowNumber + 1;
        });
        return next;
      }

      function openEdit(entry) {
        editRow = entry.rowNumber;
        editName.value = entry.name || '';
        editAmount.value = plainAmount(entry.amount);
        if (state.currencies.indexOf(entry.currency) !== -1) editCurrency.value = entry.currency;
        editCategory = isChipCategory(entry.category) ? entry.category : (state.categories[0] ? state.categories[0].name : '');
        editPayment = isChipCode(entry.paymentCode) ? entry.paymentCode : state.defaultPaymentCode;
        renderCategoryChips(editCategoryChips, editCategory, onEditCategory);
        renderPaymentChoices(editPaymentChips, editPayment, onEditPayment);
        disarmDelete();
        setLive(editStatus, '', false);
        editForm.hidden = false;
        editForm.scrollIntoView({ block: 'nearest' });
      }

      function closeEdit() {
        editForm.hidden = true;
        editRow = 0;
        disarmDelete();
        setLive(editStatus, '', false);
      }

      function onEditCategory(name) {
        editCategory = name;
        disarmDelete();
        renderCategoryChips(editCategoryChips, editCategory, onEditCategory);
      }

      function onEditPayment(code) {
        editPayment = code;
        disarmDelete();
        renderPaymentChoices(editPaymentChips, editPayment, onEditPayment);
      }

      function renderPaymentChoices(container, selected, onPick) {
        container.textContent = '';
        state.payments.forEach(function (payment) {
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = payment.name || payment.code;
          button.setAttribute('aria-pressed', payment.code === selected ? 'true' : 'false');
          if (payment.code === selected) button.classList.add('is-on');
          button.addEventListener('click', function () { onPick(payment.code); });
          container.appendChild(button);
        });
      }

      function onEditSubmit(event) {
        event.preventDefault();
        if (!isRowNumber(editRow) || saving) return;
        disarmDelete();
        var name = editName.value;
        var amountText = editAmount.value.trim();
        var currency = editCurrency.value;
        if (demo) {
          var localAmount = demoAmount(amountText);
          if (localAmount === null) {
            setLive(editStatus, '金額不合理', true);
            return;
          }
          state.recent.forEach(function (entry) {
            if (entry.rowNumber !== editRow) return;
            var display = name.trim() || '（未命名）';
            if (display.indexOf('（範例）') === -1) display += '（範例）';
            entry.name = display;
            entry.amount = localAmount;
            entry.currency = currency || 'TWD';
            entry.category = editCategory;
            entry.paymentCode = editPayment;
            entry.paymentName = paymentName(editPayment);
            entry.twd = entry.currency === 'TWD' ? localAmount : entry.twd;
          });
          renderRecent();
          setLive(editStatus, '本機預覽，沒有寫入帳本。', false);
          return;
        }
        saving = true;
        google.script.run.withSuccessHandler(function (result) {
          saving = false;
          if (!result || !result.ok) {
            setLive(editStatus, (result && result.message) || '沒有改到', true);
            return;
          }
          setLive(editStatus, result.message || '已更新。', false);
          refreshRecent();
        }).withFailureHandler(function () {
          saving = false;
          setLive(editStatus, '連線失敗，請再試一次。', true);
        }).updateEntryFromWeb(editRow, name, amountText, currency, editCategory, editPayment);
      }

      function onDeleteTap() {
        if (!isRowNumber(editRow) || saving) return;
        if (!deleteArmed) {
          deleteArmed = true;
          editDelete.textContent = '確定刪除';
          editDelete.classList.add('is-armed');
          return;
        }
        if (demo) {
          state.recent = state.recent.filter(function (entry) { return entry.rowNumber !== editRow; });
          renderRecent();
          closeEdit();
          setStatus('本機預覽，沒有寫入帳本。', false);
          return;
        }
        saving = true;
        google.script.run.withSuccessHandler(function (result) {
          saving = false;
          if (!result || !result.ok) {
            setLive(editStatus, (result && result.message) || '沒有刪除', true);
            disarmDelete();
            return;
          }
          closeEdit();
          setStatus(result.message || '已刪除。', false);
          refreshRecent();
        }).withFailureHandler(function () {
          saving = false;
          disarmDelete();
          setLive(editStatus, '連線失敗，請再試一次。', true);
        }).deleteEntryFromWeb(editRow, true);
      }

      function disarmDelete() {
        deleteArmed = false;
        editDelete.textContent = '刪除';
        editDelete.classList.remove('is-armed');
      }

      function plainAmount(value) {
        var amount = Number(value);
        if (!isFinite(amount)) return '';
        return String(Math.round(amount * 1000000) / 1000000);
      }

      function demoAmount(text) {
        if (!/^\d+(?:\.\d{1,2})?$/.test(text)) return null;
        var amount = Number(text);
        if (!isFinite(amount) || amount === 0) return null;
        return amount;
      }

      function isRowNumber(value) {
        return Number.isInteger(value) && value >= 2 && value <= 100000;
      }

      function isChipCategory(name) {
        return /^[\u4e00-\u9fffA-Za-z0-9]{1,20}$/.test(String(name || ''));
      }

      function isCurrencyCode(code) {
        return /^[A-Z]{3}$/.test(String(code || ''));
      }

      function chipCodeForToken(token) {
        var folded = String(token || '').toLowerCase();
        var found = state.payments.filter(function (payment) {
          return payment.code.toLowerCase() === folded || String(payment.name || '').toLowerCase() === folded;
        })[0];
        if (found) return found.code;
        if (/^[\u4e00-\u9fffA-Za-z0-9]{1,12}轉帳$/.test(token)) return token;
        return '';
      }

      function previewLocally(line) {
        var text = String(line || '').trim();
        if (/^日誌(?:$|[\s:：])/.test(text)) {
          var body = text.replace(/^日誌[\s:：]*/, '').trim();
          if (!body) return { ok: false, message: '請輸入日誌內容' };
          return { ok: true, type: 'log', summary: '日誌 · ' + body };
        }
        var tokens = text.split(/\s+/);
        var typed = '';
        var rest = [];
        tokens.forEach(function (token) {
          var code = chipCodeForToken(token);
          if (code) typed = code;
          else rest.push(token);
        });
        var amount = null;
        var at = -1;
        rest.forEach(function (token, index) {
          if (/^\d+(?:\.\d+)?$/.test(token)) {
            amount = Number(token);
            at = index;
          }
        });
        if (amount === null) return { ok: false, message: '請輸入金額' };
        var nameParts = rest.filter(function (_, index) { return index !== at; });
        var marked = takeDemoCategory(nameParts);
        if (marked) {
          nameParts = nameParts.filter(function (token) {
            return !/^(?:分類|cat)\s*[:：]/i.test(token) && !/^\[[^\]]+\]$/.test(token);
          });
        }
        var name = nameParts.join(' ') || '（未命名）';
        var key = name.trim().toLowerCase();
        var guessed = marked || demoCategory(name);
        return {
          ok: true,
          type: 'expense',
          date: '2026-01-02',
          time: '',
          name: name,
          merchantKey: key,
          amount: amount,
          currency: 'TWD',
          category: guessed.category,
          categorySource: guessed.source,
          explicitPaymentCode: typed,
          suggestedPaymentCode: DEMO_MEMORY[key] || state.defaultPaymentCode,
          summary: name + ' ' + amount + ' TWD'
        };
      }

      function takeDemoCategory(tokens) {
        for (var i = 0; i < tokens.length; i++) {
          var token = tokens[i];
          var label = '';
          var marked = String(token).match(/^(?:分類|cat)\s*[:：]\s*(.+)$/i);
          if (marked) label = marked[1];
          else if (/^\[[^\]]+\]$/.test(token)) label = token.slice(1, -1);
          if (!label) continue;
          var found = state.categories.filter(function (category) {
            return category.name.toLowerCase() === String(label).trim().toLowerCase();
          })[0];
          if (found) return { category: found.name, source: 'explicit' };
        }
        return null;
      }

      function demoCategory(name) {
        var text = String(name || '');
        try { text = text.normalize('NFKC'); } catch (err) { /* keep the original */ }
        var folded = text.toLowerCase();
        if (/(?:^|[^A-Za-z0-9])x\s*[\u3400-\u9fff]/i.test(text) || /[\u3400-\u9fff]\s*x(?:[^A-Za-z0-9]|$)/i.test(text)) {
          return { category: 'AI工具', source: 'keyword' };
        }
        var words = ['supergrok', 'chatgpt', 'claude', 'cursor', 'gemini', 'perplexity', 'openai', 'copilot', 'midjourney', 'grok'];
        for (var i = 0; i < words.length; i++) {
          var pattern = new RegExp('(^|[^a-z0-9])' + words[i] + '([^a-z0-9]|$)');
          if (pattern.test(folded)) return { category: 'AI工具', source: 'keyword' };
        }
        if (/早餐|午餐|中餐|晚餐|咖啡/.test(text)) return { category: '吃', source: 'keyword' };
        if (/書/.test(text)) return { category: '書', source: 'keyword' };
        return { category: '日常', source: 'fallback' };
      }
    })();
  </script>
</body>
</html>
